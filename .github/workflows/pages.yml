name: Deploy Daily Brief to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install podcast build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python3 -m pip install --quiet pillow

      - name: Build podcast audio metadata
        run: python3 scripts/build_audio_meta.py

      - name: Generate podcast cover
        shell: bash
        run: |
          python3 scripts/generate_podcast_cover.py
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('podcast-cover.jpg')
          assert im.size == (3000, 3000), im.size
          print('podcast cover:', im.size)
          PY

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
