name: Test Daily Release Harness

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Deterministic release/recovery scenario
        required: true
        type: choice
        options:
          - all
          - happy-path
          - podcast-missing
          - duplicate-guid
          - mapping-mismatch
          - already-published
      date:
        description: Synthetic test date; must not be a real production date
        required: false
        default: '2099-01-01'

permissions:
  contents: read

concurrency:
  group: test-daily-release-harness
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATE: ${{ inputs.date }}
      SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Checkout written repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Assert test isolation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DATE" =~ ^20[5-9][0-9]-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "Test date must be safely synthetic (2050-2099): $DATE"
            exit 1
          }
          for v in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_URL; do
            test -z "${!v:-}" || { echo "Test harness must not receive production R2 secret: $v"; exit 1; }
          done
          echo "Isolation PASS: read-only token, synthetic date, no production R2 credentials."

      - name: Build isolated fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/release-test
          mkdir -p build/release-test/root/_drafts build/release-test/root/_posts build/release-test/root/_data
          cat > "build/release-test/root/_drafts/${DATE}-daily-brief.md" <<EOF
          ---
          layout: daily_brief
          title: "${DATE}"
          date: ${DATE} 07:00:00 +0800
          ---
          Synthetic release harness fixture for ${DATE}.
          EOF
          printf '{}\n' > build/release-test/root/_data/audio.json
          cat > build/release-test/feed-ok.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0" xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd">
            <channel>
              <item>
                <title>龙虾日报｜synthetic</title>
                <guid isPermaLink="false">ep999-daily-${DATE}</guid>
                <enclosure url="https://mock.invalid/daily/ep999-daily-${DATE}.mp3" length="123456" type="audio/mpeg" />
                <itunes:duration>00:03:21</itunes:duration>
                <itunes:episodeType>full</itunes:episodeType>
              </item>
            </channel>
          </rss>
          EOF
          cp build/release-test/feed-ok.xml build/release-test/feed-duplicate.xml
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          p='build/release-test/feed-duplicate.xml'
          t=ET.parse(p); ch=t.getroot().find('channel'); item=ch.find('item')
          ch.append(ET.fromstring(ET.tostring(item, encoding='unicode')))
          ET.register_namespace('itunes','http://www.itunes.com/dtds/podcast-1.0.dtd')
          t.write(p, encoding='utf-8', xml_declaration=True)
          PY
          cat > build/release-test/feed-missing.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0" xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd"><channel></channel></rss>
          EOF

      - name: Run deterministic scenarios
        shell: bash
        run: |
          set -euo pipefail

          fresh_fixture() {
            rm -rf build/release-test/work
            cp -a build/release-test/root build/release-test/work
          }

          run_happy() {
            echo "::group::happy-path"
            fresh_fixture
            python scripts/check_release_state.py --date "$DATE" --feed build/release-test/feed-ok.xml --root build/release-test/work > build/release-test/happy-before.json
            grep -q '"final_state": "podcast_verified"' build/release-test/happy-before.json
            python scripts/publish_staged_daily.py --date "$DATE" --feed build/release-test/feed-ok.xml --root build/release-test/work > build/release-test/happy-publish.json
            test ! -f "build/release-test/work/_drafts/${DATE}-daily-brief.md"
            test -f "build/release-test/work/_posts/${DATE}-daily-brief.md"
            python scripts/check_release_state.py --date "$DATE" --feed build/release-test/feed-ok.xml --root build/release-test/work > build/release-test/happy-after.json
            grep -q '"final_state": "written_published"' build/release-test/happy-after.json
            grep -q '"audio_mapping_match": true' build/release-test/happy-after.json
            echo "::endgroup::"
          }

          run_missing() {
            echo "::group::podcast-missing"
            fresh_fixture
            python scripts/check_release_state.py --date "$DATE" --feed build/release-test/feed-missing.xml --root build/release-test/work > build/release-test/missing-state.json
            grep -q '"final_state": "written_staged"' build/release-test/missing-state.json
            if python scripts/publish_staged_daily.py --date "$DATE" --feed build/release-test/feed-missing.xml --root build/release-test/work; then
              echo "Expected publication to fail without Podcast item"
              exit 1
            fi
            test -f "build/release-test/work/_drafts/${DATE}-daily-brief.md"
            echo "::endgroup::"
          }

          run_duplicate() {
            echo "::group::duplicate-guid"
            fresh_fixture
            if python scripts/publish_staged_daily.py --date "$DATE" --feed build/release-test/feed-duplicate.xml --root build/release-test/work; then
              echo "Expected duplicate Podcast GUID/date lineage to fail"
              exit 1
            fi
            test -f "build/release-test/work/_drafts/${DATE}-daily-brief.md"
            echo "::endgroup::"
          }

          run_mismatch() {
            echo "::group::mapping-mismatch"
            fresh_fixture
            mv "build/release-test/work/_drafts/${DATE}-daily-brief.md" "build/release-test/work/_posts/${DATE}-daily-brief.md"
            python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('build/release-test/work/_data/audio.json')
          p.write_text(json.dumps({os.environ['DATE']:'https://mock.invalid/wrong.mp3'}, indent=2)+'\n')
          PY
            if python scripts/check_release_state.py --date "$DATE" --feed build/release-test/feed-ok.xml --root build/release-test/work > build/release-test/mismatch-state.json; then
              echo "Expected mapping mismatch checker failure"
              exit 1
            fi
            grep -q '"audio_mapping_match": false' build/release-test/mismatch-state.json
            echo "::endgroup::"
          }

          run_already() {
            echo "::group::already-published-idempotence"
            fresh_fixture
            python scripts/publish_staged_daily.py --date "$DATE" --feed build/release-test/feed-ok.xml --root build/release-test/work >/dev/null
            BEFORE=$(sha256sum "build/release-test/work/_posts/${DATE}-daily-brief.md" | awk '{print $1}')
            python scripts/publish_staged_daily.py --date "$DATE" --feed build/release-test/feed-ok.xml --root build/release-test/work >/dev/null
            AFTER=$(sha256sum "build/release-test/work/_posts/${DATE}-daily-brief.md" | awk '{print $1}')
            test "$BEFORE" = "$AFTER"
            python scripts/check_release_state.py --date "$DATE" --feed build/release-test/feed-ok.xml --root build/release-test/work > build/release-test/already-state.json
            grep -q '"audio_mapping_match": true' build/release-test/already-state.json
            echo "::endgroup::"
          }

          case "$SCENARIO" in
            all) run_happy; run_missing; run_duplicate; run_mismatch; run_already ;;
            happy-path) run_happy ;;
            podcast-missing) run_missing ;;
            duplicate-guid) run_duplicate ;;
            mapping-mismatch) run_mismatch ;;
            already-published) run_already ;;
            *) echo "Unknown scenario: $SCENARIO"; exit 2 ;;
          esac

      - name: Prove production repository was not mutated
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "PASS: tracked production repository state unchanged."

      - name: Build test report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          report={
            "mode":"ISOLATED_RELEASE_TEST",
            "date":os.environ["DATE"],
            "scenario":os.environ["SCENARIO"],
            "production_feed_written":False,
            "production_r2_written":False,
            "production_pages_deployed":False,
            "production_repository_written":False,
            "result":"PASS"
          }
          pathlib.Path("build/release-test/report.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-test-${{ inputs.scenario }}-${{ github.run_id }}
          path: build/release-test/
          retention-days: 7
