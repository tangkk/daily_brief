name: Generate Spoken Daily Brief Audio

on:
  push:
    branches: [main]
    paths:
      - 'spoken/*.md'
      - '.github/workflows/spoken-audio.yml'
      - 'scripts/generate_audio.py'
      - 'scripts/tts_normalize.py'
      - 'scripts/test_tts_normalize.py'
      - 'scripts/xfyun_tts.py'
      - 'scripts/r2_storage.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spoken-audio
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XFYUN_APPID: ${{ secrets.XFYUN_APPID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || vars.R2_PUBLIC_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test TTS normalization
        run: python3 scripts/test_tts_normalize.py

      - name: Resolve latest spoken brief
        id: brief
        shell: bash
        run: |
          latest=$(find spoken -maxdepth 1 -type f -name '????-??-??.md' | sort | tail -1)
          test -n "$latest" || { echo 'No spoken brief found'; exit 1; }
          date=$(basename "$latest" .md)
          echo "path=$latest" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          if [[ "$date" < "2026-08-21" ]]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "Historical spoken brief ($date): audio generation intentionally disabled"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.brief.outputs.generate == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install TTS and R2 dependencies
        if: steps.brief.outputs.generate == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate credentials
        if: steps.brief.outputs.generate == 'true'
        shell: bash
        run: |
          test -n "$XFYUN_APPID" || { echo 'Missing XFYUN_APPID'; exit 1; }
          test -n "$XFYUN_API_KEY" || { echo 'Missing XFYUN_API_KEY'; exit 1; }
          test -n "$XFYUN_API_SECRET" || { echo 'Missing XFYUN_API_SECRET'; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo 'Missing R2_ACCESS_KEY_ID'; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo 'Missing R2_SECRET_ACCESS_KEY'; exit 1; }
          test -n "$R2_ENDPOINT" || { echo 'Missing R2_ENDPOINT'; exit 1; }
          test -n "$R2_BUCKET" || { echo 'Missing R2_BUCKET'; exit 1; }
          test -n "$R2_PUBLIC_BASE_URL" || { echo 'Missing R2_PUBLIC_BASE_URL'; exit 1; }

      - name: Generate audio from spoken script
        if: steps.brief.outputs.generate == 'true'
        shell: bash
        run: |
          date="${{ steps.brief.outputs.date }}"
          cp "${{ steps.brief.outputs.path }}" "/tmp/${date}-daily-brief.md"
          python scripts/generate_audio.py \
            --post "/tmp/${date}-daily-brief.md" \
            --audio-dir .tts-audio \
            --manifest _data/audio.json \
            --normalized-text-out ".tts-audio/${date}-normalized.txt"

      - name: Upload audio to R2
        if: steps.brief.outputs.generate == 'true'
        run: python scripts/r2_storage.py --audio-dir .tts-audio --manifest _data/audio.json

      - name: Persist audio manifest
        if: steps.brief.outputs.generate == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/audio.json
          if ! git diff --cached --quiet; then
            git commit -m "Update spoken audio manifest for ${{ steps.brief.outputs.date }}"
            git push
          else
            echo 'Audio already published; manifest unchanged'
          fi
