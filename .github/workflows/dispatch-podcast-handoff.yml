name: Dispatch Podcast Handoff

on:
  push:
    branches: [main]
    paths:
      - 'handoffs/*-spoken.txt'
  workflow_dispatch:
    inputs:
      date:
        description: Asia/Shanghai date, YYYY-MM-DD
        required: true

permissions:
  contents: read

concurrency:
  group: podcast-handoff-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve handoff date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE:-}" ]; then
            DATE="$INPUT_DATE"
          else
            FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^handoffs/[0-9]{4}-[0-9]{2}-[0-9]{2}-spoken\.txt$' | head -n 1)
            test -n "$FILE"
            DATE=$(basename "$FILE" -spoken.txt)
          fi
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [[ "$DATE" =~ ^20[5-9][0-9]- ]]; then echo "dry_run=true" >> "$GITHUB_OUTPUT"; else echo "dry_run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Dispatch Podcast ingestion
        env:
          TOKEN: ${{ secrets.PODCAST_DISPATCH_TOKEN }}
          DATE: ${{ steps.date.outputs.date }}
          DRY_RUN: ${{ steps.date.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN" || {
            echo "Missing PODCAST_DISPATCH_TOKEN. Configure a fine-grained token with Actions write access to tangkk/lobster-daily-podcast."
            exit 1
          }
          curl --fail-with-body --retry 3 --max-time 20 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tangkk/lobster-daily-podcast/actions/workflows/ingest-daily-handoff.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"date\":\"$DATE\",\"dry_run\":\"$DRY_RUN\"}}"
