---
layout: null
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}" />
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/icon.svg' | relative_url }}" />
  <link rel="apple-touch-icon" href="{{ '/assets/icon.svg' | relative_url }}" />
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS" href="{{ '/feed.xml' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p>{{ site.description }}</p>
    </div>
  </header>

  <main class="container">
    <section>
      <h2>最新文章</h2>
      <ul class="post-list">
        {% for post in site.posts %}
          <li>
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            <span class="date">{{ post.date | date: "%Y-%m-%d" }}</span>
          </li>
        {% else %}
          <li>还没有文章，先发布第一篇吧。</li>
        {% endfor %}
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© {{ site.time | date: "%Y" }} {{ site.title }} · <a href="{{ '/feed.xml' | relative_url }}">RSS 订阅</a></p>
    </div>
  </footer>
</body>
</html>
